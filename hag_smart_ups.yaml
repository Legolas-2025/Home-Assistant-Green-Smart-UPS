# ============================================================================
#  HAG Smart UPS - ESPHome configuration
#  Version:  v1.3.0-alpha  (2026-10-11)
#  Target:   ESPHome 2026.9.1  (validated: `esphome config` -> valid)
#  Board:    ESP32-H2 Super Mini + SLZB-MR5U OTBR
#  License:  MIT - Copyright (c) 2026 Legolas-2025
# ============================================================================
#  WHAT'S NEW IN 1.3.0-alpha - RECORDER PROTECTION PARADIGM BUILD
#  1. Recorder Protection: a deterministic "UPS Critical Battery Alert" binary
#     sensor arms at 10 % SoC during an outage (11 % release hysteresis). A
#     Home Assistant automation watches it and calls recorder.disable, cleanly
#     detaching home-assistant_v2.db before the battery can die. The HAG stays
#     alive and recovers automatically when mains returns. (The ESPHome side
#     cannot call recorder.* itself - the HA automations are in the README.)
#  2. Sliding-window smoothing on the MAX17043 SoC + voltage rejects the
#     transient current ripples from HAG eMMC I/O bursts. All safety
#     thresholds run on the RAW value (on_raw_value), so smoothing can never
#     delay a critical event.
#  3. Adaptive Thread cadence: 15 s polling during an outage; on mains the
#     fuel gauge relaxes to the slider value (default 300 s) while the cell
#     sensors stay fixed at 60 s so the thermal interlock remains responsive
#     during charging cycles.
#  4. Local thermal interlock: >= 48 C on either cell raises a local binary
#     sensor + error log entirely on-device - works with the Thread link down.
#  5. MAX17043 hardware cross-check: the chip's own low-battery comparator is
#     programmed to 10 % at boot. NOTE: on the MAX17043 the alert threshold is
#     NOT a separate ALET register (that is the MAX17048/49 VALERT at 0x14) -
#     it lives in CONFIG (0x0C) bits 4:0, encoded as (32 - percent). Optional
#     ALRT -> GPIO12 wiring exposes the hardware alert as a binary sensor.
#
#  VERIFIED AGAINST ESPHOME 2026.9.1 AND THIS BOARD (do not "re-fix" these):
#  - There is NO `component.update_interval` action in ESPHome 2026.9.1 - the
#    action registry (automation.py) only registers component.update /
#    component.suspend / component.resume. Runtime interval changes therefore
#    use PollingComponent::set_update_interval() in a lambda - the mechanism
#    already proven in v1.2.x of this project.
#  - Mains detection is GPIO4 (PC817) and 1-Wire is GPIO5. GPIO9 and GPIO8 are
#    unusable on the Super Mini: GPIO9 is the BOOT button and GPIO8 drives the
#    onboard LOG RGB LED; ESPHome additionally lists GPIO8/9/25 as ESP32-H2
#    strapping pins, so neither is usable for external signals. Full audit with
#    the reserved-pin sets is in the PIN SAFETY AUDIT block below.
#  - `on_press` = mains RESTORED, `on_release` = mains LOST (inverted:true
#    maps the PC817's LOW-when-mains-present to logical ON). See v1.2.0 notes.
# ============================================================================
esphome:
  name: hag-ups-monitor
  friendly_name: HAG UPS Monitor
  comment: "HAG Smart UPS v1.3.0-alpha"
  on_boot:
    # Runs late so every component (and the NVS-restored slider) is ready.
    priority: -100
    then:
      # --- MAX17043 hardware alert threshold -> 10 % ---
      # CONFIG (0x0C) bits 4:0 hold the alert threshold as (32 - percent);
      # bits 5-7 (alert status / unused / sleep) and the whole high byte are
      # preserved. POR default is 0x971C (threshold 4 %); raising it to 10 %
      # makes the chip's own ALRT comparator agree with the software trigger.
      - lambda: |-
          uint16_t cfg = 0;
          if (!id(ups_fuel_gauge).read_byte_16(0x0C, &cfg)) {
            ESP_LOGW("fuelgauge", "MAX17043 CONFIG read failed - alert left at POR default (4%%)");
          } else {
            const uint16_t updated = (cfg & 0xFFE0) | (32 - 10);
            if (id(ups_fuel_gauge).write_byte_16(0x0C, updated)) {
              ESP_LOGI("fuelgauge", "MAX17043 hardware alert threshold set to 10%% (CONFIG 0x%04X -> 0x%04X)", cfg, updated);
            } else {
              ESP_LOGW("fuelgauge", "MAX17043 alert threshold write failed");
            }
          }
      # --- Re-apply the NVS-restored poll cadence ---
      # If the boot happens during an outage, the mains binary sensor
      # publishes its first state within ~1 s and its on_release handler
      # switches everything to 15 s; this block only restores the slider.
      - lambda: |-
          const uint32_t slider_ms = (uint32_t)(id(update_interval_slider).state * 1000);
          id(ups_fuel_gauge).set_update_interval(slider_ms);
          id(ups_temp_cell_1).set_update_interval(60000);
          id(ups_temp_cell_2).set_update_interval(60000);
          ESP_LOGI("ups", "Poll cadence restored: fuel gauge %.0f s (slider), cells 60 s", id(update_interval_slider).state);
      # The NVS-backed text sensors run with `update_interval: never`, so they
      # never self-publish. Emit the restored values once at boot, otherwise
      # Home Assistant shows "unknown" until the first event occurs.
      - lambda: |-
          id(time_sync_status).publish_state(id(saved_time_sync_status));
          id(last_outage_time).publish_state(id(saved_outage_time));
          id(last_restore_time).publish_state(id(saved_restore_time));
          id(last_low_bat_time).publish_state(id(saved_low_bat_time));
          id(last_reboot_time).publish_state(id(saved_reboot_time));

# ============================================================================
#  PIN SAFETY AUDIT - ESP32-H2 SUPER MINI
#  Verified against ESPHome 2026.9.1 (esphome/components/esp32/gpio_esp32_h2.py)
#  and the ESP-IDF ESP32-H2 "GPIO Summary". The H2 exposes GPIO0-GPIO27; the
#  chip reserves:
#    SPI flash (SPI0/1) : GPIO15-GPIO21  (+ GPIO6/7 on SiP-flash variants)
#    USB-Serial-JTAG    : GPIO26, GPIO27
#    Strapping pins     : GPIO8, GPIO9, GPIO25
#  ESPHome's built-in SDA/SCL aliases resolve to GPIO21/GPIO22 on EVERY ESP32
#  variant, and GPIO21 is a SPI-flash pin on the H2 - so sda:/scl: MUST be
#  explicit (see the i2c block below).
#  Board-side reservations on the Super Mini (see README pinout table):
#    GPIO24/GPIO23 = U0TXD / U0RXD   GPIO8 = onboard LOG RGB LED
#    GPIO9         = BOOT button      GPIO13/GPIO14 = 32K crystal pads
#  PINS USED BY THIS CONFIG - every one is outside all reserved sets:
#    GPIO4  mains detection (PC817)     ADC1_CH3  - safe
#    GPIO5  1-Wire / DS18B20            ADC1_CH4  - safe
#    GPIO10 I2C SDA  (MAX17043)         ZCD0      - safe
#    GPIO11 I2C SCL  (MAX17043)         ZCD1      - safe
#    GPIO12 MAX17043 ALRT (optional)    RTC GPIO  - safe
#  Deliberately left unwired: GPIO0-3 (JTAG/FSPI), GPIO6-7 and GPIO15-21 (SPI
#  flash), GPIO8/9/25 (strapping), GPIO13/14 (32K crystal), GPIO22 (spare),
#  GPIO23/24 (UART), GPIO26/27 (USB D-/D+).
# ============================================================================
esp32:
  variant: esp32h2
  board: esp32-h2-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

# Native Home Assistant API for instant push-based status delivery
api:
  encryption:
    key: !secret hag_ups_monitor__encryption_key

ota:
  - platform: esphome

# Boot-loop guard. Addresses the known "Boot Loop on Power Restore" issue: a
# brown-out on the 5V rail during mains restore falls back to the last
# known-good firmware instead of bricking the node. safe_mode is a top-level
# component (it is auto-loaded by ota:) - it is NOT an ota: platform.
safe_mode:
  boot_is_good_after: 2min
  num_attempts: 10
  reboot_timeout: 5min

# Thread is IPv6-only, so this is mandatory when openthread is used.
network:
  enable_ipv6: true

# Thread configuration utilizing the SLZB-MR5U OTBR.
# NOTE: `tlv` is the correct key in ESPHome 2026.9.x (esphome/components/
# openthread/const.py: CONF_TLV = "tlv"). There is no `network_dataset` key.
# The value is a hex-encoded operational dataset TLV, NOT a file path.
openthread:
  device_type: MTD
  tlv: !secret my_thread_dataset

# Explicit pins are mandatory on ESP32-H2: ESPHome's built-in SDA/SCL aliases
# resolve to GPIO21/GPIO22 on every ESP32 variant, and GPIO21 is a SPI-flash
# pin on the H2. GPIO10 (ZCD0) / GPIO11 (ZCD1) are safe general-purpose I/O here.
i2c:
  sda: GPIO10
  scl: GPIO11
  scan: true

# 1-Wire bus configuration for DS18B20 cells
one_wire:
  - platform: gpio
    pin: GPIO5

# Persistent globals to save timestamps safely (using escaped quotes for strings)
globals:
  - id: saved_outage_time
    type: std::string
    restore_value: yes
    initial_value: "\"Never\""
  - id: saved_restore_time
    type: std::string
    restore_value: yes
    initial_value: "\"Never\""
  - id: saved_low_bat_time
    type: std::string
    restore_value: yes
    initial_value: "\"Never\""
  - id: saved_reboot_time
    type: std::string
    restore_value: no
    initial_value: "\"Starting up...\""
  - id: saved_time_sync_status
    type: std::string
    restore_value: no
    initial_value: "\"Pending...\""
  - id: low_bat_logged
    type: bool
    restore_value: no
    initial_value: "false"

sensor:
  # `id` on the platform component is required so the update-interval slider
  # and the mains-detection handlers can retune the fuel gauge polling loop
  # at runtime via set_update_interval().
  - platform: max17043
    id: ups_fuel_gauge
    address: 0x36
    battery_level:
      name: "UPS Battery Level"
      id: ups_battery_level
      icon: "mdi:battery"
      accuracy_decimals: 1
      filters:
        # 1) Sliding-window moving average: averages the last
        #    10 readings and emits every 5th, absorbing the short current
        #    ripples from HAG eMMC I/O bursts that show up as false SoC dips.
        #    At the 15 s outage cadence a smoothed value lands every 75 s -
        #    ample for a ~5 h runtime, and the safety thresholds below bypass
        #    the filters entirely via on_raw_value.
        - sliding_window_moving_average:
            window_size: 10
            send_every: 5
        # 2) delta: transmit only a real >= 1 % move of the smoothed value.
        #    The sensor is still READ every poll; the filters only suppress
        #    the Thread send.
        - delta: 1
      # on_raw_value, not on_value: these are safety thresholds, so they must
      # be evaluated on EVERY raw reading even when the filters drop the send.
      on_raw_value:
        then:
          - lambda: |-
              const bool on_batt = !id(mains_power_status).state;
              const bool critical_now = id(ups_critical_state).state;
              // --- Recorder Protection trigger ---
              // Arm only during an outage; 10 % ON / 11 % OFF hysteresis.
              if (!critical_now && on_batt && x <= 10.0) {
                id(ups_critical_state).publish_state(true);
                ESP_LOGW("battery", "CRITICAL: SoC %.1f %% <= 10 %% during outage - recorder protection should engage", x);
              } else if (critical_now && (x >= 11.0 || !on_batt)) {
                // De-latch the MAX17043 ALRT comparator too (reading CONFIG
                // clears its alert status bit) so the optional hardware alert
                // sensor recovers together with the software one.
                uint16_t dummy = 0;
                id(ups_fuel_gauge).read_byte_16(0x0C, &dummy);
                id(ups_critical_state).publish_state(false);
                ESP_LOGI("battery", "Critical battery alert cleared (SoC %.1f %%)", x);
              }
              // --- 3 % last-chance timestamp (unchanged from v1.2.x) ---
              if (on_batt && x <= 3.0) {
                if (!id(low_bat_logged) && id(current_time).now().is_valid()) {
                  auto time_str = id(current_time).now().strftime("%Y-%m-%d %H:%M:%S");
                  id(saved_low_bat_time) = time_str;
                  id(last_low_bat_time).publish_state(time_str);
                  // NOTE: "3%%" - a bare "%" followed by a space is parsed by GCC as the
                  // printf ' ' flag on a %b conversion, which reads a non-existent argument.
                  ESP_LOGI("battery", "Critical 3%% battery threshold reached during outage. Timestamp saved!");
                  id(low_bat_logged) = true;
                }
              }
    battery_voltage:
      name: "UPS Battery Voltage"
      id: ups_battery_voltage
      icon: "mdi:battery-high"
      accuracy_decimals: 2
      filters:
        # Same smoothing chain as SoC; transmit only on a >= 0.05 V move.
        - sliding_window_moving_average:
            window_size: 10
            send_every: 5
        - delta: 0.05
    # Default matches the slider's initial_value; on_boot and the
    # mains-detection handlers retune this at runtime.
    update_interval: 300s

  # --- Dual 18650 Temperature Monitoring + Local Thermal Interlock (1.4) ---
  # `index` is 0-BASED and requires ESPHome >= 2025.11.0. It is mutually
  # exclusive with `address`. Probe order follows ROM codes, so it can change
  # if sensors are swapped - replace with `address:` once the IDs are known
  # (ESPHome logs print the unique hex address of each sensor on first boot).
  - platform: dallas_temp
    index: 0
    name: "UPS Battery Cell 1 Temperature"
    id: ups_temp_cell_1
    icon: "mdi:thermometer"
    # Mains cadence is FIXED at 60 s (NOT the slider): a developing internal
    # fault lifts an 18650 by roughly 15 C/min at 10 W, and the dense charging
    # cycles that stress a pack happen on MAINS. Throttling the cells
    # to 300 s would gut the thermal interlock exactly when it is needed.
    # During an outage both cells drop to 15 s together with the fuel gauge.
    update_interval: 60s
    filters:
      # Read every poll (cheap, local 1-Wire), but transmit only a real 0.5 C move.
      - delta: 0.5
    # Thermal thresholds run on the RAW value: the delta filter must never
    # gate a safety event. This interlock is fully local - it keeps working
    # with the Thread link down and Home Assistant unreachable.
    on_raw_value:
      then:
        - lambda: |-
            if (!id(ups_thermal_fault).state && x >= 48.0) {
              id(ups_thermal_fault).publish_state(true);
              ESP_LOGE("thermal", "CRITICAL CELL THERMAL EVENT: cell 1 at %.1f C (limit 48 C) - local interlock engaged", x);
            } else if (id(ups_thermal_fault).state && id(ups_temp_cell_1).state <= 45.0 && id(ups_temp_cell_2).state <= 45.0) {
              // Release only when BOTH cells are back below the hysteresis point.
              id(ups_thermal_fault).publish_state(false);
              ESP_LOGW("thermal", "Both cells back <= 45 C - thermal interlock released");
            }

  - platform: dallas_temp
    index: 1
    name: "UPS Battery Cell 2 Temperature"
    id: ups_temp_cell_2
    icon: "mdi:thermometer"
    update_interval: 60s
    filters:
      - delta: 0.5
    on_raw_value:
      then:
        - lambda: |-
            if (!id(ups_thermal_fault).state && x >= 48.0) {
              id(ups_thermal_fault).publish_state(true);
              ESP_LOGE("thermal", "CRITICAL CELL THERMAL EVENT: cell 2 at %.1f C (limit 48 C) - local interlock engaged", x);
            } else if (id(ups_thermal_fault).state && id(ups_temp_cell_1).state <= 45.0 && id(ups_temp_cell_2).state <= 45.0) {
              id(ups_thermal_fault).publish_state(false);
              ESP_LOGW("thermal", "Both cells back <= 45 C - thermal interlock released");
            }

  - platform: openthread_info
    # `update_interval` must sit INSIDE each entity key - the platform-level
    # key is rejected: "[update_interval] is an invalid option for
    # [sensor.openthread_info]".
    # ESPHome's defaults are very aggressive: parent_last_rssi polls every 5 s,
    # role / ip_address / channel every 1 s. Left at defaults those four
    # entities alone pushed ~11,500 messages per hour over the Thread link.
    # Thread signal margin alongside battery status: satisfied
    # by this RSSI entity - diagnostics only, deliberately slow.
    parent_last_rssi:
      name: "UPS Thread Signal Strength"
      update_interval: 900s

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      # PC817 collector pulls GPIO4 LOW while the LED conducts (mains present).
      # inverted:true makes LOW -> state true, so ON == mains present.
      inverted: true
    name: "Mains Power Status"
    id: mains_power_status
    device_class: plug
    icon: "mdi:power-plug"
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      # State became TRUE = mains is PRESENT = mains restored.
      # (on_press fires on the logical state going true, NOT on a rising pin edge.)
      then:
        - logger.log: "Mains power restored! Saving timestamp, relaxing telemetry, clearing critical alert..."
        - lambda: |-
            if (id(current_time).now().is_valid()) {
              auto time_str = id(current_time).now().strftime("%Y-%m-%d %H:%M:%S");
              id(saved_restore_time) = time_str;
              id(last_restore_time).publish_state(time_str);
            } else {
              id(saved_restore_time) = "Time Sync Pending";
              id(last_restore_time).publish_state("Time Sync Pending");
            }
            // Reset so the next outage can log 3% again
            id(low_bat_logged) = false;
        # Recovery side of the Recorder Protection Paradigm: the alert sensor
        # drops the moment mains returns; the HA automation watching it calls
        # recorder.enable (see README). The CONFIG read de-latches the chip's
        # ALRT comparator.
        - if:
            condition:
              binary_sensor.is_on: ups_critical_state
            then:
              - lambda: |-
                  uint16_t dummy = 0;
                  id(ups_fuel_gauge).read_byte_16(0x0C, &dummy);
                  id(ups_critical_state).publish_state(false);
        # Adaptive Thread cadence: relax the fuel gauge to the
        # slider value (default 300 s); cells return to their fixed 60 s.
        - lambda: |-
            const uint32_t ms = (uint32_t)(id(update_interval_slider).state * 1000);
            id(ups_fuel_gauge).set_update_interval(ms);
            id(ups_temp_cell_1).set_update_interval(60000);
            id(ups_temp_cell_2).set_update_interval(60000);
            ESP_LOGI("ups", "Mains cadence: fuel gauge %.0f s, cells 60 s", id(update_interval_slider).state);
    on_release:
      # State became FALSE = mains is LOST = power outage.
      then:
        - logger.log: "Power outage detected! Saving timestamp, ramping telemetry to 15 s..."
        - lambda: |-
            if (id(current_time).now().is_valid()) {
              auto time_str = id(current_time).now().strftime("%Y-%m-%d %H:%M:%S");
              id(saved_outage_time) = time_str;
              id(last_outage_time).publish_state(time_str);
            } else {
              id(saved_outage_time) = "Time Sync Pending";
              id(last_outage_time).publish_state("Time Sync Pending");
            }
        # Ramp everything to 15 s for live diagnostics during the outage.
        - lambda: |-
            id(ups_fuel_gauge).set_update_interval(15000);
            id(ups_temp_cell_1).set_update_interval(15000);
            id(ups_temp_cell_2).set_update_interval(15000);
            ESP_LOGI("ups", "Outage cadence: all telemetry 15 s");

  # --- Recorder Protection trigger ---
  # Published only by the fuel-gauge handler: arms at <= 10 % SoC during an
  # outage, releases at >= 11 % or the instant mains returns. Home Assistant
  # automations watch this entity to call recorder.disable / recorder.enable.
  - platform: template
    name: "UPS Critical Battery Alert"
    id: ups_critical_state
    device_class: battery
    icon: "mdi:battery-alert-variant-outline"

  # --- Local thermal interlock ---
  # Set locally by either cell handler at >= 48 C, released only when BOTH
  # cells are back at <= 45 C. Fully on-device; works with Thread down.
  - platform: template
    name: "UPS Battery Thermal Fault"
    id: ups_thermal_fault
    device_class: heat
    icon: "mdi:thermometer-alert"

  # --- Optional hardware cross-check ---
  # Wire MAX17043 ALRT (open-drain; asserts LOW when SoC drops below the 10 %
  # threshold programmed at boot) to GPIO12 if your breakout exposes it.
  # Unwired, the internal pull-up simply keeps this sensor OFF. The latch is
  # cleared by the CONFIG read performed whenever the critical alert clears.
  - platform: gpio
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: true
      inverted: true
    name: "UPS Fuel Gauge Alert (Hardware)"
    id: ups_hw_alert
    device_class: battery
    icon: "mdi:alarm-light"

text_sensor:
  # Thread diagnostics (role / IP / channel). Requires ESPHome >= 2025.6 for
  # the openthread component; the openthread_info platforms landed after that.
  - platform: openthread_info
    # Defaults here are 1s EACH - see the note on the RSSI sensor above.
    role:
      name: "Thread Device Role"
      update_interval: 900s
    ip_address:
      name: "Thread IP Address"
      update_interval: 900s
    channel:
      name: "Thread Channel"
      update_interval: 900s

  # Time Sync Status Sensor
  - platform: template
    name: "Time sync"
    id: time_sync_status
    icon: "mdi:clock-check-outline"
    # These NVS-backed entities are published explicitly by the mains-detection
    # and time-sync handlers, so self-polling would only re-send identical
    # strings. on_boot publishes the restored values once.
    update_interval: never

  # NVS-backed Event Timestamps pulling from globals
  - platform: template
    name: "Last Power Outage Time"
    id: last_outage_time
    icon: "mdi:clock-alert"
    update_interval: never
    lambda: |-
      return id(saved_outage_time);

  - platform: template
    name: "Last Mains Restore Time"
    id: last_restore_time
    icon: "mdi:clock-check"
    update_interval: never
    lambda: |-
      return id(saved_restore_time);

  - platform: template
    name: "Last Low Battery 3% Time"
    id: last_low_bat_time
    icon: "mdi:clock-remove"
    update_interval: never
    lambda: |-
      return id(saved_low_bat_time);

  - platform: template
    name: "Last Reboot Time"
    id: last_reboot_time
    icon: "mdi:restart"
    update_interval: never
    lambda: |-
      return id(saved_reboot_time);

number:
  - platform: template
    name: "Sensor Update Interval"
    id: update_interval_slider
    icon: "mdi:timer-cog"
    min_value: 10
    max_value: 300
    step: 10
    mode: slider
    unit_of_measurement: "s"
    restore_value: true
    initial_value: 300
    optimistic: true
    # v1.3.0+: governs the MAINS cadence of the fuel gauge only. During an
    # outage everything is forced to 15 s regardless of the slider; the cell
    # sensors keep a fixed 60 s on mains so the thermal interlock stays
    # responsive during charging. A change made while on battery takes effect
    # when mains returns.
    set_action:
      - logger.log: "Sensor update interval changed"
      - lambda: |-
          ESP_LOGI("ups", "Mains poll interval set to %.0f s (fuel gauge)", x);
          if (id(mains_power_status).state) {
            id(ups_fuel_gauge).set_update_interval((uint32_t)(x * 1000));
          } else {
            ESP_LOGI("ups", "On battery - new interval will apply when mains returns");
          }

button:
  - platform: restart
    name: "Restart UPS Monitor"
    id: restart_button
    icon: "mdi:restart"

# Time sync retry logic: checks every 30s, up to 9 times (~4.5 minutes)
interval:
  - interval: 30s
    then:
      - lambda: |-
          static int retry_count = 0;
          static bool time_synced = false;

          if (!time_synced) {
            if (id(current_time).now().is_valid()) {
              auto time_str = id(current_time).now().strftime("%Y-%m-%d %H:%M:%S");
              id(saved_reboot_time) = time_str;
              id(last_reboot_time).publish_state(time_str);

              // Update status global and push state
              id(saved_time_sync_status) = "Success";
              id(time_sync_status).publish_state("Success");

              ESP_LOGI("time_sync", "Time successfully synchronized: %s", time_str.c_str());
              time_synced = true;
            } else {
              retry_count++;
              ESP_LOGW("time_sync", "Time sync pending... attempt %d of 9", retry_count);

              if (retry_count >= 9) {
                id(saved_time_sync_status) = "Failed - try to restart";
                id(time_sync_status).publish_state("Failed - try to restart");
                ESP_LOGE("time_sync", "Time sync failed after 9 attempts. Stopping retries.");
                time_synced = true; // Stops further attempts
              }
            }
          }

time:
  # DEPENDENCIES = ["api"] in ESPHome, so the api: block above is mandatory.
  - platform: homeassistant
    id: current_time
